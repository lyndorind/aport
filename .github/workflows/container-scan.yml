name: Container Image Security Scan

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE_REF: quay.io/lyndorind/aport:latest

jobs:
  scan-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull Docker image
        run: docker pull ${{ env.IMAGE_REF }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-scan

      - name: Run Grype vulnerability scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          grype ${{ env.IMAGE_REF }} -o sarif > grype-results.sarif

      - name: Upload Grype scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('grype-results.sarif') != ''
        with:
          sarif_file: grype-results.sarif
          category: grype-container-scan

      - name: Run Snyk Container scan
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE_REF }}
          args: --sarif-file-output=snyk-results.sarif

      - name: Sanitize Snyk SARIF file
        if: always() && hashFiles('snyk-results.sarif') != ''
        run: |
          jq '(.runs[].tool.driver.rules[]?.properties | select(has("security-severity")) | .["security-severity"]) |= (if (tonumber? // null) == null then "5.0" else tostring end)' snyk-results.sarif > snyk-clean.sarif

      - name: Upload Snyk scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('snyk-clean.sarif') != ''
        with:
          sarif_file: snyk-clean.sarif
          category: snyk-container-scan