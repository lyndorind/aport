name: JMeter Load Test

on:
  pull_request:
    branches: [ main, master ]

jobs:
  jmeter-load-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aport
          POSTGRES_PASSWORD: aport_secret_pass
          POSTGRES_DB: aportdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and start API
        env:
          DATABASE_URL: postgres://aport:aport_secret_pass@localhost:5432/aportdb
          PORT: 3000
        run: |
          npm install
          npm start &
          sleep 5
          curl -f http://localhost:3000/health

      - name: Download Apache JMeter
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Run JMeter Load Test
        run: |
          ./apache-jmeter-5.6.3/bin/jmeter -n -t load-test.jmx -l results.jtl

      - name: Upload JMeter Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-load-report
          path: results.jtl