name: Manual Container Security Scan

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Версія (тег) образу в Quay.io (наприклад, 1.3.0 або latest)"
        required: true
        default: "1.3.0"
        type: string

env:
  IMAGE_REF: quay.io/lyndorind/aport:${{ inputs.image_version }}

jobs:
  manual-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull target Docker image version
        run: docker pull ${{ env.IMAGE_REF }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-manual.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-manual.sarif') != ''
        with:
          sarif_file: trivy-manual.sarif
          category: trivy-manual-scan

      - name: Run Grype vulnerability scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          grype ${{ env.IMAGE_REF }} -o sarif > grype-manual.sarif

      - name: Upload Grype scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('grype-manual.sarif') != ''
        with:
          sarif_file: grype-manual.sarif
          category: grype-manual-scan

      - name: Run Snyk Container scan
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE_REF }}
          args: --sarif-file-output=snyk-manual.sarif

      - name: Sanitize Snyk SARIF file
        if: always() && hashFiles('snyk-manual.sarif') != ''
        run: |
          jq '(.runs[].tool.driver.rules[]?.properties | select(has("security-severity")) | .["security-severity"]) |= (if (tonumber? // null) == null then "5.0" else tostring end)' snyk-manual.sarif > snyk-manual-clean.sarif

      - name: Upload Snyk scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('snyk-manual-clean.sarif') != ''
        with:
          sarif_file: snyk-manual-clean.sarif
          category: snyk-manual-scan